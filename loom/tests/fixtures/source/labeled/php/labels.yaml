# Labels record what PHP binds, written from the language rules before loom
# ran. Namespaces are declared with the statement form, so they scope nothing.
# `Loggable` is a trait Widget uses: `$this->log()` runs the trait's method.
# `Saver::save` has no body, so `$saver->save($this)` is dispatched at run time
# and a reader cannot choose between DiskSaver and MemSaver without the runtime
# type. `require_once 'bootstrap.php'` finds the file next to the including one.
dialect: php
