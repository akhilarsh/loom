# Labels record what javac binds, written from the language rules before loom
# ran. `app.core` and `app.util` are two packages; `Saver` is an interface, so
# `saver.save(this)` is dispatched at run time and a reader cannot choose
# between its two implementations without the runtime type. `Saver.save` has no
# body, so it is not a declaration the extractor claims.
